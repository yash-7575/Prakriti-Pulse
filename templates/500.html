{% extends "base.html" %}

{% block title %}Server Error - Prakriti Pulse{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-red-50 to-pink-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full text-center">
        <div class="text-6xl mb-6">⚠️</div>
        <h1 class="text-4xl font-bold text-gray-900 mb-4">500 - Server Error</h1>
        <p class="text-xl text-gray-600 mb-8">
            Something went wrong on our end. Please try again later.
        </p>
        <div class="space-y-4">
            <a href="{{ url_for('home') }}" 
               class="block bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200">
                Go Home
            </a>
            <button onclick="window.history.back()" 
                    class="block bg-gray-600 hover:bg-gray-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 w-full">
                Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
